<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="FROST custom firmware for the SNOWSKY Echo Mini: 24 themes, 10-band EQ, bit-perfect playback up to 192 kHz">
