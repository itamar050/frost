<rect x="300" y="384" width="56" height="32" rx="10" fill="none" stroke="#2A3B5C" stroke-width="3"/>
</g>
<g font-family="'Helvetica Neue', Arial, sans-serif">
<text x="490" y="490" fill="#FF8A3D" font-weight="900" font-size="40">24 themes</text>
<text x="490" y="526" fill="#C7D3E6" font-size="21">Cassette play screen with spinning reels.</text>
<text x="490" y="554" fill="#C7D3E6" font-size="21">Neon, Matrix, Sakura, Green Hill, EVA and more.</text>
<text x="490" y="628" fill="#7FD3FF" font-weight="900" font-size="40">10-band EQ</text>
<text x="490" y="664" fill="#C7D3E6" font-size="21">Eight presets plus custom.</text>
<text x="490" y="692" fill="#C7D3E6" font-size="21">Fully bypassed when off.</text>
<text x="490" y="766" fill="#E8F1FF" font-weight="900" font-size="40">Up to 192 kHz</text>
<text x="490" y="802" fill="#C7D3E6" font-size="21">Bit-perfect lossless, native rates,</text>
<text x="490" y="830" fill="#C7D3E6" font-size="21">volume set in the DACs.</text>
<path d="M490 875l16 13-7 6V860l7 6-16 13" fill="none" stroke="#7FD3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="518" y="893" fill="#7FD3FF" font-weight="900" font-size="36">Bluetooth</text>
</g>
