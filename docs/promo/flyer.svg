<text x="80" y="92" fill="#7FD3FF">CUSTOM FIRMWARE · v1.2d</text>
<text x="1000" y="92" fill="#A9B8D0" text-anchor="end" font-size="20">FOR SNOWSKY ECHO MINI</text>
</g>
<text x="72" y="300" fill="#E8F1FF" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="210" letter-spacing="-6">FROST</text>
<text x="80" y="370" fill="#E8F1FF" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="42">Your music, <tspan fill="#FF8A3D">ice cold</tspan> and bit-perfect.</text>
