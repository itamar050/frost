<text x="80" y="1080"><tspan fill="#E8F1FF" font-weight="700">Shuffle all</tspan> your music</text>
<text x="400" y="1080"><tspan fill="#E8F1FF" font-weight="700">Audiobooks</tspan> with chapters</text>
<text x="720" y="1080"><tspan fill="#E8F1FF" font-weight="700">Resume</tspan> where you stopped</text>
<text x="80" y="1118"><tspan fill="#E8F1FF" font-weight="700">Huge folders</tspan>, quick jump</text>
<text x="400" y="1118"><tspan fill="#E8F1FF" font-weight="700">Your buttons</tspan>, remapped</text>
<text x="720" y="1118"><tspan fill="#E8F1FF" font-weight="700">Hebrew &amp; RTL</tspan> tags</text>
</g>
